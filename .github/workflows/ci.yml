name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch numpy pandas scikit-learn pyyaml pytest fastapi httpx uvicorn

      - name: Run tests
        run: |
          PYTHONPATH=. pytest -v tests/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t tgn-test .

      - name: Run container and smoke-test endpoints
        run: |
          docker run -d -p 8000:8000 --name tgn-test-container tgn-test
          for i in {1..15}; do
            if curl -sf http://localhost:8000/health; then break; fi
            sleep 2
          done
          curl -sf http://localhost:8000/health
          docker logs tgn-test-container
          docker stop tgn-test-container